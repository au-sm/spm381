<svg xmlns="http://www.w3.org/2000/svg" class="anim-p04" viewBox="107.2 -59.2 5560.7 3948.4" width="5561" height="3948" role="img" aria-label="Factors affecting sport consumption: Thoughts, Feelings and Other people each point to Sport Consumption">
<style>
.anim-p04{text-rendering:auto;-webkit-font-smoothing:auto;-moz-osx-font-smoothing:auto;letter-spacing:normal;word-spacing:normal;font-kerning:auto;font-variant:normal;font-feature-settings:normal;}
.anim-p04 .a-pop,.anim-p04 .a-grow-r,.anim-p04 .a-lbl{transform-box:fill-box;}
.anim-p04 .a-pop{transform-origin:50% 50%;}
.anim-p04 .a-grow-r{transform-origin:100% 50%;}
.anim-p04.play .a-pop{animation:p04-pop 600ms cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(250ms + var(--d,0ms));}
.anim-p04.play .a-grow-r{animation:p04-grow 650ms cubic-bezier(.65,0,.35,1) backwards;animation-delay:calc(250ms + var(--d,0ms));}
.anim-p04.play .a-lbl{animation:p04-lbl 600ms cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(250ms + var(--d,0ms));}
@keyframes p04-pop{from{opacity:0;transform:scale(.86);}to{opacity:1;transform:scale(1);}}
@keyframes p04-grow{from{opacity:0;transform:scaleX(0);}30%{opacity:1;}to{opacity:1;transform:scaleX(1);}}
@keyframes p04-lbl{from{opacity:0;transform:translateY(60px);}to{opacity:1;transform:translateY(0);}}
@keyframes p04-fade{from{opacity:0;}to{opacity:1;}}
@media (prefers-reduced-motion: reduce){
.anim-p04.play .a-pop,.anim-p04.play .a-grow-r,.anim-p04.play .a-lbl{animation:p04-fade 150ms linear backwards;animation-delay:0ms;}
}
</style>
