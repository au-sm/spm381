<svg xmlns="http://www.w3.org/2000/svg" viewBox="204.0 298.2 862.3 329.2" width="862" height="329" role="img" aria-label="Not all consumers are equally passionate; neither are they all resistant to change; some attend regularly, others only on special occasions. Arrow pointing to: Challenges of narrowing a set of homogeneous traits.">
<defs><filter id="sh" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#201c16" flood-opacity="0.22"/></filter></defs>
<rect x="258.1" y="330.5" width="13" height="13" fill="#a3392f"/>
<rect x="256.1" y="328.5" width="13" height="13" fill="#ffffff" stroke="#a3392f" stroke-width="2"/>
<text x="285.1" y="335.0" font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#201c16" dominant-baseline="middle">Not all consumers are equally passionate.</text>
<rect x="258.1" y="362.5" width="13" height="13" fill="#a3392f"/>
<rect x="256.1" y="360.5" width="13" height="13" fill="#ffffff" stroke="#a3392f" stroke-width="2"/>
<text x="285.1" y="367.0" font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#201c16" dominant-baseline="middle">Neither are they all resistant to change (i.e.,</text>
<text x="285.1" y="399.0" font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#201c16" dominant-baseline="middle">loyalty) that threatens team values and practices.</text>
<rect x="258.1" y="426.5" width="13" height="13" fill="#a3392f"/>
<rect x="256.1" y="424.5" width="13" height="13" fill="#ffffff" stroke="#a3392f" stroke-width="2"/>
<text x="285.1" y="431.0" font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#201c16" dominant-baseline="middle">Some attend games on a regular basis, while</text>
<text x="285.1" y="463.0" font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#201c16" dominant-baseline="middle">others attend only on special occasions.</text>
<path d="M220.0,567.3 L377.2,567.3 L377.2,552.6 L406.6,582.0 L377.2,611.4 L377.2,596.7 L220.0,596.7 Z" fill="#a3392f" filter="url(#sh)"/>
<rect x="429.5" y="538.3" width="620.8" height="73.1" fill="#201c16" filter="url(#sh)"/>
<text font-family="Georgia, 'Times New Roman', serif" font-size="24.0" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle"><tspan x="739.9" y="559.4">Challenges of narrowing a set of</tspan><tspan x="739.9" y="591.4">homogeneous traits.</tspan></text>
</svg>
