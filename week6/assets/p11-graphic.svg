<text x="1894" y="1754" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Old</text>
<circle cx="1675" cy="2173" r="38" fill="#a3392f"/>
<text x="1894" y="2173" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Genuine</text>
