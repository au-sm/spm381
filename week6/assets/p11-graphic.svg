<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14110d"/><stop offset="1" stop-color="#3a332a"/></linearGradient></defs>
<text x="4516" y="290" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="305" fill="#201c16"><tspan fill="#a3392f">❖</tspan> Dualistic Fan Typologies</text>
<line x1="3266" y1="490" x2="5766" y2="490" stroke="#a3392f" stroke-width="10" opacity=".35"/>
<rect x="1466" y="1405" width="2849" height="3283" fill="#f3e1de" stroke="#a3392f" stroke-opacity=".35" stroke-width="13"/>
