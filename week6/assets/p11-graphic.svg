<text x="1894" y="4270" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Die-hard</text>
<rect x="4713" y="1405" width="2849" height="3283" fill="#ece8e1" stroke="#201c16" stroke-opacity=".35" stroke-width="13"/>
<rect x="4713" y="656" width="2849" height="749" fill="url(#g2)"/>
<text x="6138" y="1030" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="330" fill="#ffffff">Type 2 Fans</text>
