<text x="5141" y="3012" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Submissive</text>
<circle cx="4922" cy="3431" r="38" fill="#201c16"/>
<text x="5141" y="3431" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Rational</text>
