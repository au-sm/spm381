<text x="5141" y="4270" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-size="310" fill="#201c16">Less-loyal</text>
<text text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="180" fill="#a3392f"><tspan x="663" y="1726">Local teams to</tspan><tspan x="663" y="1942">construct a</tspan><tspan x="663" y="2158">sense of</tspan><tspan x="663" y="2374">community</tspan></text>
<text text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="180" fill="#a3392f"><tspan x="663" y="3747">Identifying</tspan><tspan x="663" y="3963">with a team</tspan></text>
<text text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="180" fill="#201c16"><tspan x="8328" y="2112">Entertaining</tspan></text>
<text text-anchor="middle" dominant-baseline="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="180" fill="#201c16"><tspan x="8328" y="3761">Identifying</tspan><tspan x="8328" y="3977">with a city</tspan></text>
