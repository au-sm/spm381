<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM 381 — Consumer Behavior in Sport</title>
<style>
  :root{
    --bg:#faf7f0; --ink:#1c1a16; --muted:#6b6355; --rule:#e6dfd0; --accent:#a3392f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:64px 24px 80px;}
  .kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:ui-monospace,Menlo,monospace;margin-bottom:14px;}
  h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;}
  .sub{color:var(--muted);margin:0 0 40px;font-size:16px;}
  .weeks{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule);}
  .weeks li{border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;padding:20px 4px;}
  .weeks a{display:flex;align-items:center;gap:16px;flex:1;min-width:0;color:inherit;text-decoration:none;}
  .weeks a:hover .label{color:var(--accent);}
  .weeks .num{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);min-width:64px;}
  .weeks .label{font-size:18px;font-weight:600;flex:1;}
  .weeks .arrow{color:var(--muted);font-size:18px;}
  .weeks .pdf-link{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--rule);border-radius:20px;padding:6px 12px;white-space:nowrap;}
  .weeks .pdf-link:hover{border-color:var(--accent);color:var(--accent);}
  footer{margin-top:48px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Arcadia University Sport Management</div>
  <h1>SPM 381 — Consumer Behavior in Sport</h1>
  <p class="sub">Lecture decks by week. Click a week to open its interactive slides.</p>
  <ul class="weeks">
    <li>
      <a href="week1/" target="_blank" rel="noopener"><span class="num">Week 1</span><span class="label">Introduction to Sport Consumer Behavior</span><span class="arrow">&rarr;</span></a>
      <a class="pdf-link" href="week1/SPM381_Week1_Slides.pdf" download>Download PDF</a>
    </li>
  </ul>
  <footer>More weeks will be added here as the course progresses.</footer>
</div>
