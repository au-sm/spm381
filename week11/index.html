7239,4533.9\" fill=\"#e8e8f0\"/><polygon points=\"7239,5143.5 7696.2,5143.5 7696.2,5029.2 7924.8,5257.8 7696.2,5486.4 7696.2,5372.1 7239,5372.1\" fill=\"#e8e8f0\"/><polygon points=\"7247.468,5905.5 7704.668,5905.5 7704.668,5791.2 7933.268,6019.8 7704.668,6248.4 7704.668,6134.1 7247.468,6134.1\" fill=\"#e8e8f0\"/><rect x=\"8077.2\" y=\"3429\" width=\"2362.2\" height=\"533.4\" rx=\"60\" fill=\"#2a3560\" stroke=\"#e8e8f0\" stroke-width=\"12\"/><text x=\"9258.3\" y=\"3695.7\" fill=\"#fff\" font-size=\"250\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\">Pride</text><rect x=\"8077.2\" y=\"4191\" width=\"2362.2\" height=\"533.4\" rx=\"60\" fill=\"#2a3560\" stroke=\"#e8e8f0\" stroke-width=\"12\"/><text x=\"9258.3\" y=\"4457.7\" fill=\"#fff\" font-size=\"250\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\">Gratitude</text><rect x=\"8077.2\" y=\"5029.2\" width=\"2362.2\" height=\"533.4\" rx=\"60\" fill=\"#2a3560\" stroke=\"#e8e8f0\" stroke-width=\"12\"/><text x=\"9258.3\" y=\"5295.9\" fill=\"#fff\" font-size=\"250\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\">Shame</text><rect x=\"8077.2\" y=\"5791.2\" width=\"2362.2\" height=\"533.4\" rx=\"60\" fill=\"#2a3560\" stroke=\"#e8e8f0\" stroke-width=\"12\"/><text x=\"9258.3\" y=\"6057.9\" fill=\"#fff\" font-size=\"250\" font-weight=\"700\" text-anchor=\"middle\" dominant-baseline=\"central\">Anger</text></svg></div>", "notes": "Four agent based emotions", "variant": "rows", "rowMark": "rule", "part": 2}, {"type": "media", "layout": "stack", "title": "Attributions—Emotion (Weiner,1985; Weiner, Russell, & Lerman, 1979)", "html": "<style>.equation:has(.w11x){all:unset;display:block;width:100%}.w11x{margin-top:1.2vh}\n.w11-flow{display:flex;align-items:stretch;gap:clamp(10px,1.6vw,26px);margin-bottom:3vh}\n.w11-box{flex:1;display:grid;place-items:center;text-align:center;padding:clamp(14px,2.4vh,28px) 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);font-size:clamp(17px,1.6vw,26px);line-height:1.25;font-weight:600}\n.w11-arrow{align-self:center;font-size:clamp(26px,2.6vw,42px);opacity:.7}\n.w11-p{font-size:clamp(18px,1.6vw,26px);line-height:1.45;margin:0 0 1.2vh}\n.w11-q{display:block;padding:clamp(14px,2.6vh,28px) 28px;margin:0 0 2vh;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);font-size:clamp(22px,2.2vw,36px);line-height:1.3}\n.w11-vid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2.6vw;align-items:center}\n.w11-note{padding:clamp(14px,2vh,24px) 22px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);font-size:clamp(16px,1.35vw,22px);line-height:1.45}</style><div class=\"w11x\"><p class=\"w11-p\"><strong>Experiments</strong></p><p class=\"w11-p\">US Men’s National Basketball Team vs. France (2024 Olympic Final)</p><div class=\"w11-vid\"><div class=\"s20\"  style=\"display:block;margin:0\"><a class=\"s20-yt\" href=\"https://www.youtube.com/watch?v=I7pTpMjqNRM\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\"><img src=\"assets/p29-picture2.jpg\" alt=\"US Men’s National Basketball Team vs. France, 2024 Olympic Final\"><span class=\"s20-play\"></span><span class=\"s20-cap\">Watch on YouTube</span></a><p class=\"s20-url\"><a href=\"https://www.youtube.com/watch?v=I7pTpMjqNRM\" target=\"_blank\" rel=\"noopener\" onclick=\"event.stopPropagation()\">https://www.youtube.com/watch?v=I7pTpMjqNRM</a></p></div><div class=\"w11-note\">This is part of this week’s discussion questions. Please see this week’s discussion question #2.</div></div></div>", "notes": "Four agent based emotions", "variant": "rows", "rowMark": "rule", "part": 2}, {"type": "media", "layout": "stack", "html": "<style>.equation:has(.w11x){all:unset;display:block;width:100%}.w11x{margin-top:1.2vh}\n.w11-flow{display:flex;align-items:stretch;gap:clamp(10px,1.6vw,26px);margin-bottom:3vh}\n.w11-box{flex:1;display:grid;place-items:center;text-align:center;padding:clamp(14px,2.4vh,28px) 16px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);font-size:clamp(17px,1.6vw,26px);line-height:1.25;font-weight:600}\n.w11-arrow{align-self:center;font-size:clamp(26px,2.6vw,42px);opacity:.7}\n.w11-p{font-size:clamp(18px,1.6vw,26px);line-height:1.45;margin:0 0 1.2vh}\n.w11-q{display:block;padding:clamp(14px,2.6vh,28px) 28px;margin:0 0 2vh;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);font-size:clamp(22px,2.2vw,36px);line-height:1.3}\n.w11-vid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:2.6vw;align-items:center}\n.w11-note{padding:clamp(14px,2vh,24px) 22px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);font-size:clamp(16px,1.35vw,22px);line-height:1.45}</style><div class=\"w11x\"><span class=\"w11-q\">When do sport consumers feel proud?</span><span class=\"w11-q\">When do sport consumers feel grateful?</span><span class=\"w11-q\">When do sport consumers feel shameful?</span><span class=\"w11-q\">When do sport consumers feel angry?</span></div>", "variant": "chips", "rowMark": "rule", "hues": ["pride", "gratitude", "shame", "anger"], "part": 2}, {"type": "closing", "title": "Questions?", "part": 2}]</script>
<script>
(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const progressFill = document.getElementById('progressFill');
  const counterEl = document.getElementById('counter');
  const sectionLabel = document.getElementById('sectionLabel');
  const pageNum = document.getElementById('pageNum');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const hint = document.getElementById('hint');
  const notesPanel = document.getElementById('notesPanel');
  const notesBody = document.getElementById('notesBody');
  const notesToggle = document.getElementById('notesToggle');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced) document.documentElement.classList.add('reduced');

  const SECTIONS = [
    {from:0,to:0,label:'Opening'},
    {from:1,to:5,label:'Why Consumer Emotion Matters'},
    {from:6,to:12,label:'Theories of Affect'},
    {from:13,to:17,label:'Mixed Emotions: Empirical Test'},
    {from:18,to:26,label:'Causal Attribution'},
    {from:27,to:29,label:'Attributions and Emotion'},
    {from:30,to:30,label:'Closing'}
  ];
  function sectionFor(i){ for(const s of SECTIONS){ if(i>=s.from && i<=s.to) return s.label; } return ''; }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function revealItem(node, delayMs){ node.classList.add('reveal-item'); node.style.transitionDelay=(delayMs||0)+'ms'; return node; }
  function isQuestion(text){ return /\?\s*$/.test(text.trim()); }
  function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function titleEl(text, delay){
    const cls = 'disp title-slide'+(text.length>52?' long':'')+' reveal-item';
    const h = el('h1',cls, escapeHTML(text));
    revealItem(h, delay||0);
    return h;
  }
  function buildKicker(text, delay){ const k = el('p','kicker reveal-item', escapeHTML(text)); revealItem(k, delay||0); return k; }

  const LINK_MARKER_RE = /\[\[LINK:([^|\]]+)\|([^\]]+)\]\]/g;
  const HL_MARKER_RE = /==([^=]+)==/g;
  function renderMarkedText(text){
    const frag = document.createDocumentFragment();
    let last = 0, m;
    LINK_MARKER_RE.lastIndex = 0;
    while((m = LINK_MARKER_RE.exec(text))){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1].trim(); a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'inherit';
      a.textContent = m[2];
      frag.appendChild(a);
      last = LINK_MARKER_RE.lastIndex;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    const out = document.createDocumentFragment();
    Array.from(frag.childNodes).forEach(node => {
      if(node.nodeType !== Node.TEXT_NODE){ out.appendChild(node); return; }
      const t = node.textContent;
      let l2 = 0, mm;
      HL_MARKER_RE.lastIndex = 0;
      while((mm = HL_MARKER_RE.exec(t))){
        if(mm.index > l2) out.appendChild(document.createTextNode(t.slice(l2, mm.index)));
        const mark = document.createElement('mark');
        mark.className = 'hl-yellow';
        mark.textContent = mm[1];
        out.appendChild(mark);
        l2 = HL_MARKER_RE.lastIndex;
      }
      if(l2 < t.length) out.appendChild(document.createTextNode(t.slice(l2)));
    });
    return out;
  }
  function buildBullets(list, baseDelay){
    const ul = el('ul','bullets');
    list.forEach((t,i)=>{
      const li = el('li','');
      li.appendChild(renderMarkedText(t));
      revealItem(li, (baseDelay||0)+90*i);
      ul.appendChild(li);
    });
    return ul;
  }
  const URL_RE = /\b((?:https?:\/\/)?(?:www\.)?[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.[a-z]{2,}(?:\.[a-z]{2,})?(?:\/[^\s]*)?)/gi;
  function linkifyText(text){
    const frag = document.createDocumentFragment();
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while((m = URL_RE.exec(text))){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      let url = m[0], trail = '';
      while(/[.,;:)\]]$/.test(url)){ trail = url.slice(-1) + trail; url = url.slice(0, -1); }
      const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = url;
      frag.appendChild(a);
      if(trail) frag.appendChild(document.createTextNode(trail));
      last = URL_RE.lastIndex;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  function buildSource(text){ const p = el('p','source reveal-item'); p.appendChild(linkifyText(text)); return p; }
  function buildPhoto(img, opts){
    opts = opts||{};
    const outer = el('div','');
    const wrap = el('div','photo'+(opts.contain?' contain':'')+(opts.kb!==false?' kb':''));
    if(opts.delay!=null) wrap.style.transitionDelay = opts.delay+'ms';
    const im = document.createElement('img');
    im.src = img.src; im.loading='lazy'; im.alt = img.caption || '';
    if(img.w && img.h) im.style.aspectRatio = img.w+' / '+img.h;
    wrap.appendChild(im);
    if(img.flawBadge){
      wrap.classList.add('flawed');
      const badge = el('div','flaw-badge');
      badge.innerHTML = '<span class="flaw-x">&#10005;</span> '+escapeHTML(img.flawBadge);
      wrap.appendChild(badge);
    }
    if(img.callout){
      wrap.appendChild(el('div','photo-callout', escapeHTML(img.callout)));
    }
    outer.appendChild(wrap);
    if(img.caption) outer.appendChild(el('div','cutline', escapeHTML(img.caption)));
    return outer;
  }
  function badgeCorner(img, delay){
    const b = el('div','badge-corner');
    b.style.transitionDelay=(delay||0)+'ms';
    const im = document.createElement('img'); im.src = img.src; im.loading='lazy';
    b.appendChild(im);
    return b;
  }

  // ---------- slide type builders ----------
  function build(slide, idx){
    const s = el('section','slide');
    s.dataset.index = idx;
    if(slide.part) s.dataset.part = slide.part;
    let inner = el('div','slide-inner');

    switch(slide.type){
      case 'title': {
        inner.style.textAlign='center'; inner.style.alignItems='center'; inner.style.justifyContent='center';
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title)); revealItem(h,140);
        inner.appendChild(h);
        if(slide.subtitle){ const sub = el('p','subtitle reveal-item', escapeHTML(slide.subtitle)); sub.style.margin='14px auto 0'; revealItem(sub,300); inner.appendChild(sub); }
        if(slide.meta){ const m = el('div','meta-badge reveal-item', escapeHTML(slide.meta)); revealItem(m,420); inner.appendChild(m); }
        break;
      }
      case 'agenda': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,60));
        const list = el('div','agenda-list');
        slide.items.forEach((it,i)=>{
          const row = el('div','agenda-row reveal-item'); revealItem(row,180+i*110);
          row.appendChild(el('div','agenda-n', escapeHTML(it.n)));
          const right = el('div','');
          right.appendChild(el('div','agenda-label', escapeHTML(it.label)));
          right.appendChild(el('div','agenda-detail', escapeHTML(it.detail)));
          row.appendChild(right);
          list.appendChild(row);
        });
        inner.appendChild(list);
        if(slide.source){ const src = buildSource(slide.source); src.classList.add('source-lg'); inner.appendChild(src); }
        break;
      }
      case 'hub': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,50));
        const wrap = el('div','hub-wrap');
        wrap.appendChild(el('div','hub-center', escapeHTML(slide.center)));
        const n = slide.spokes.length, radiusPct = 40;
        slide.spokes.forEach((label,i)=>{
          const angle = (Math.PI*2*i/n) - Math.PI/2;
          const dx = radiusPct*Math.cos(angle), dy = radiusPct*Math.sin(angle);
          const x = 50+dx, y = 50+dy;
          const line = el('div','hub-spoke-line');
          const len = Math.sqrt(dx*dx+dy*dy);
          line.style.width = 'calc(' + len + '% * 1.02)';
          line.style.transform = 'rotate(' + (Math.atan2(dy,dx)*180/Math.PI) + 'deg)';
          line.style.transitionDelay = (200+i*70)+'ms';
          wrap.appendChild(line);
          const node = el('div','hub-node', escapeHTML(label));
          node.style.left = x+'%'; node.style.top = y+'%'; node.style.transitionDelay = (300+i*70)+'ms';
          wrap.appendChild(node);
        });
        inner.appendChild(wrap);
        if(slide.bullets && slide.bullets.length) inner.appendChild(buildBullets(slide.bullets, 200+n*70+120));
        break;
      }
      case 'blank': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,50));
        const card = el('div','blank-card reveal-item'); revealItem(card,140);
        const parts = slide.blankText.split('[[BLANK]]');
        const txt = el('div','blank-text');
        parts.forEach((part,i)=>{
          txt.appendChild(document.createTextNode(part));
          if(i < parts.length-1){
            const fill = el('span','blank-fill', escapeHTML((slide.fills&&slide.fills[i])||'      '));
            fill.style.transitionDelay = (600+i*220)+'ms';
            txt.appendChild(fill);
          }
        });
        card.appendChild(txt);
        inner.appendChild(card);
        if(slide.hint) inner.appendChild(el('div','blank-hint reveal-item', escapeHTML(slide.hint)));
        break;
      }
      case 'datatable': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,40));
        const wrap = el('div','data-table-wrap reveal-item'); revealItem(wrap,160);
        if(slide.tableLabel || slide.tableTitle){
          const cap = el('div','data-table-cap');
          cap.appendChild(el('div','dtc-label', escapeHTML(slide.tableLabel||'')));
          cap.appendChild(el('div','dtc-title', escapeHTML(slide.tableTitle||'')));
          wrap.appendChild(cap);
        }
        const scroll = el('div','data-table-scroll');
        const g = slide.grid;
        const table = el('table','data-table'+(g?' data-grid':''));
        const thead = el('thead','');
        const htr = el('tr','');
        (g ? g.columns : slide.columns).forEach(c=> htr.appendChild(el('th','',escapeHTML(c))));
        thead.appendChild(htr); table.appendChild(thead);
        const tbody = el('tbody','');
        if(g){
          /* real multi-column grid (rebuilt from the pptx table) */
          g.rows.forEach((row,ri)=>{
            const tr = el('tr','reveal-item'); revealItem(tr, 220+ri*70);
            row.forEach((cell,ci)=>{
              if(ci===0){ tr.appendChild(el('th','dt-var',escapeHTML(cell))); return; }
              const v = String(cell).trim();
              const td = el('td','dt-mark '+(/^o$/i.test(v)?'is-yes':(/^x$/i.test(v)?'is-no':'')), escapeHTML(v));
              td.setAttribute('aria-label', g.columns[ci]+': '+(/^o$/i.test(v)?'yes':'no'));
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        } else {
          slide.rows.forEach((row,ri)=>{
            const tr = el('tr','reveal-item'); revealItem(tr, 260+ri*70);
            tr.appendChild(el('td','dt-cluster', escapeHTML(row[0])));
            const behCell = el('td','dt-behaviors');
            row[1].forEach(line=> behCell.appendChild(el('div','',escapeHTML(line))));
            tr.appendChild(behCell);
            tbody.appendChild(tr);
          });
        }
        table.appendChild(tbody);
        scroll.appendChild(table);
        wrap.appendChild(scroll);
        inner.appendChild(wrap);
        if(slide.source){
          if(slide.legend){ const lg = el('p','table-legend reveal-item', escapeHTML(slide.source)); revealItem(lg, 700); inner.appendChild(lg); }
          else inner.appendChild(buildSource(slide.source));
        }
        break;
      }
      case 'flow': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,60));
        if(slide.lede){ const l = el('p','lede reveal-item'); l.appendChild(renderMarkedText(slide.lede)); revealItem(l,120); inner.appendChild(l); }
        const wrap = el('div','flow-wrap');
        slide.stages.forEach((st,i)=>{
          const row = el('div','flow-step reveal-item'); revealItem(row, 200+i*130);
          const left = el('div','');
          left.appendChild(el('div','flevel', escapeHTML(st.level||'')));
          const mid = el('div','');
          mid.appendChild(el('div','flabel', escapeHTML(st.label)));
          if(st.process) mid.appendChild(el('div','fproc', escapeHTML(st.process)));
          const outs = el('div','flow-outs');
          (st.outcomes||[]).forEach(o=> outs.appendChild(el('span','flow-chip', escapeHTML(o))));
          row.appendChild(left); row.appendChild(mid); row.appendChild(outs);
          wrap.appendChild(row);
        });
        inner.appendChild(wrap);
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets, 200+slide.stages.length*130+80));
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }
      case 'compare': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        if(slide.badge) inner.appendChild(badgeCorner(slide.badge,140));
        inner.appendChild(titleEl(slide.title,40));
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets,120));
        const grid = el('div','compare-grid');
        slide.panels.forEach((p,pi)=>{
          const panel = el('div','compare-panel '+p.tone+' reveal-item');
          revealItem(panel, 280+pi*160);
          panel.appendChild(el('div','compare-head', escapeHTML(p.label)));
          p.items.forEach(it=>{
            const item = el('div','compare-item');
            item.appendChild(el('div','ci-name', escapeHTML(it.name)));
            item.appendChild(el('div','ci-full', escapeHTML(it.full)));
            item.appendChild(el('div','ci-detail', escapeHTML(it.detail)));
            panel.appendChild(item);
          });
          grid.appendChild(panel);
        });
        inner.appendChild(grid);
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }
      case 'media': {
        const imgs = slide.images || [];
        const YT_RE = /^\s*\[\[LINK:(https?:\/\/(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})[^|\]]*)\|([^\]]+)\]\]\s*$/;
        const videos = (slide.bullets||[]).map(t=>{ const m = String(t).match(YT_RE); return m ? {url:m[1], id:m[2], text:t} : null; });
        const isVideo = videos.length>0 && videos.every(Boolean);
        const hasText = !!(slide.quote || slide.html || (slide.bullets && slide.bullets.length));
        let layout = slide.stage || slide.layout || 'stack';
        if(!hasText && !isVideo && slide.look!=='prompt') layout = 'stack';            /* image-only: no empty text column */
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        if(slide.title) inner.appendChild(titleEl(slide.title,50));

        function photoOpts(im, d){ return {delay:d, contain: im.fit==='contain', kb: im.still!==true}; }
        function mediaSet(list, d0){
          const set = el('div','media-set'+(list.length>1?' multi n'+list.length:''));
          list.forEach((im,i)=>{ const ph = buildPhoto(im, photoOpts(im, d0+i*140)); ph.classList.add('media-item');
            if(im.w && im.h){ ph.style.setProperty('--ar', (im.w/im.h).toFixed(4)); ph.style.setProperty('--nw', im.w); ph.style.setProperty('--up', im.w < 420 ? 1.6 : 2); }
            set.appendChild(ph); });
          return set;
        }
        function bodyContent(delayBase){
          const frag = document.createDocumentFragment();
          if(slide.html){
            /* rich equation (sub/superscripts); the plain `quote` duplicate is not rendered */
            const eq = el('div','equation reveal-item'); eq.innerHTML = slide.html; revealItem(eq,delayBase); frag.appendChild(eq); delayBase+=140;
          } else if(slide.quote){ const pq = el('p','pullquote reveal-item'); pq.appendChild(renderMarkedText(slide.quote)); revealItem(pq,delayBase); frag.appendChild(pq); delayBase+=140; }
          if(slide.bullets && slide.bullets.length){ frag.appendChild(buildBullets(slide.bullets, delayBase)); }
          return frag;
        }

        if(isVideo){
          /* embedded, playable YouTube players + clickable fallback link; images[i] pairs with video i */
          const grid = el('div','video-grid n'+videos.length);
          videos.forEach((v,i)=>{
            const card = el('div','video-card reveal-item'); revealItem(card, 160+i*160);
            if(imgs[i]){ const ph = buildPhoto(imgs[i], photoOpts(imgs[i], 200+i*160)); ph.classList.add('video-logo'); card.appendChild(ph); }
            const fr = el('div','video-frame');
            const ifr = document.createElement('iframe');
            ifr.src = 'https://www.youtube-nocookie.com/embed/'+v.id+'?rel=0';
            ifr.title = 'YouTube video '+v.id; ifr.loading = 'lazy';
            ifr.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
            ifr.allowFullscreen = true; ifr.referrerPolicy = 'strict-origin-when-cross-origin';
            fr.appendChild(ifr); card.appendChild(fr);
            const link = el('p','video-link'); link.appendChild(renderMarkedText(v.text)); card.appendChild(link);
            grid.appendChild(card);
          });
          imgs.slice(videos.length).forEach((im,i)=> grid.appendChild(buildPhoto(im, photoOpts(im, 400+i*140))));
          inner.appendChild(grid);
        } else if(layout === 'split' || layout === 'split-reverse'){
          const grid = el('div','split-grid'+(layout==='split-reverse'?' reverse':''));
          const text = el('div','split-text');
          text.appendChild(bodyContent(120));
          const media = el('div','split-media');
          if(imgs.length) media.appendChild(mediaSet(imgs, 260));
          grid.appendChild(text); grid.appendChild(media);
          inner.appendChild(grid);
        } else {
          const body = el('div','stack-body'+(hasText?'':' image-only'));
          body.appendChild(bodyContent(100));
          if(imgs.length) body.appendChild(mediaSet(imgs, 280));
          inner.appendChild(body);
        }

        if(slide.source){ const src = buildSource(slide.source); src.classList.add('source-lg'); inner.appendChild(src); }
        break;
      }
      case 'closing': {
        inner.classList.add('closing-wrap');
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title)); revealItem(h,100);
        const rule = el('div','rule reveal-item'); revealItem(rule,40);
        const rule2 = el('div','rule reveal-item'); revealItem(rule2,360);
        inner.appendChild(rule); inner.appendChild(h);
        if(slide.subtitle){ const sub=el('p','subtitle reveal-item', escapeHTML(slide.subtitle)); revealItem(sub,220); inner.appendChild(sub); }
        inner.appendChild(rule2);
        break;
      }
      default: break;
    }
    if(slide.type!=='title' && slide.type!=='closing'){
      const t = inner.querySelector(':scope > h1.title-slide');
      const k = inner.querySelector(':scope > .kicker');
      if(t && k && (k.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING)) t.after(k);
      if(slide.subhead){ const sh = el('p','subhead reveal-item', escapeHTML(slide.subhead)); revealItem(sh,90); (k||t||inner.firstChild).after(sh); }
    }
    s.appendChild(inner);
    return s;
  }

  const slideEls = SLIDES.map((sl,i)=> build(sl,i));
  slideEls.forEach(e=> deck.appendChild(e));

  let current = -1, notesOpen = false;

  function activate(idx){
    current = idx;
    slideEls.forEach((e,i)=>{
      if(i===idx){ e.classList.add('active'); }
      else{
        e.classList.remove('active');
        e.querySelectorAll('.reveal-item').forEach(r=> r.classList.remove('in'));
        e.querySelectorAll('.photo').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.banner-wrap').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.hub-center,.hub-node,.hub-spoke-line').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.badge-corner').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.blank-fill').forEach(x=> x.classList.remove('in'));
      }
    });
    const activeEl = slideEls[idx];
    requestAnimationFrame(()=>{
      activeEl.querySelectorAll('.reveal-item').forEach(r=> r.classList.add('in'));
      activeEl.querySelectorAll('.photo').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.banner-wrap').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.hub-center,.hub-node,.hub-spoke-line').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.badge-corner').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.blank-fill').forEach(x=> x.classList.add('in'));
    });

    progressFill.style.width = ((idx)/(SLIDES.length-1)*100).toFixed(2)+'%';
    counterEl.textContent = (idx+1)+' / '+SLIDES.length;
    sectionLabel.textContent = sectionFor(idx);
    pageNum.textContent = String(idx+1).padStart(2,'0');
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===SLIDES.length-1;

    const notesText = SLIDES[idx].notes;
    if(notesText){
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p></p>';
      notesBody.querySelector('p').appendChild(linkifyText(notesText));
      notesToggle.style.opacity = 1;
    } else {
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p class="notes-empty">No speaker notes for this slide.</p>';
      notesToggle.style.opacity = .45;
    }
    location.hash = 's'+(idx+1);
  }

  function next(){ if(current < SLIDES.length-1) activate(current+1); hideHint(); }
  function prev(){ if(current > 0) activate(current-1); hideHint(); }
  let hintHidden = false;
  function hideHint(){ if(!hintHidden){ hint.classList.add('hide'); hintHidden = true; } }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  deck.addEventListener('click', (e)=>{ if(e.target.closest('a')) return; next(); });

  window.addEventListener('keydown', (e)=>{
    const tag = (e.target && e.target.tagName) || '';
    if(tag==='TEXTAREA' || tag==='INPUT' || (e.target && e.target.isContentEditable)) return;
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); activate(0); }
    else if(e.key==='End'){ e.preventDefault(); activate(SLIDES.length-1); }
    else if(e.key==='n' || e.key==='N'){ toggleNotes(); }
    else if(e.key==='Escape'){ if(notesOpen) toggleNotes(); }
    else if(e.key==='+' || e.key==='='){ e.preventDefault(); zoomIn(); }
    else if(e.key==='-' || e.key==='_'){ e.preventDefault(); zoomOut(); }
    else if(e.key==='0'){ e.preventDefault(); zoomReset(); }
  });

  const ZOOM_MIN=0.75, ZOOM_MAX=2, ZOOM_STEP=0.1;
  let zoomLevel = 1;
  try{ const saved = parseFloat(localStorage.getItem('spm381_w11_zoom')); if(!isNaN(saved)&&saved>=ZOOM_MIN&&saved<=ZOOM_MAX) zoomLevel=saved; }catch(err){}
  function applyZoom(){
    document.documentElement.style.setProperty('--zoom', zoomLevel.toFixed(2));
    zoomResetBtn.textContent = Math.round(zoomLevel*100)+'%';
    zoomOutBtn.disabled = zoomLevel<=ZOOM_MIN; zoomInBtn.disabled = zoomLevel>=ZOOM_MAX;
    try{ localStorage.setItem('spm381_w11_zoom', zoomLevel); }catch(err){}
  }
  function zoomIn(){ zoomLevel=Math.min(ZOOM_MAX,+(zoomLevel+ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoomLevel=Math.max(ZOOM_MIN,+(zoomLevel-ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoomLevel=1; applyZoom(); }
  zoomInBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomIn(); });
  zoomOutBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomOut(); });
  zoomResetBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  function toggleNotes(){ notesOpen = !notesOpen; notesPanel.classList.toggle('open', notesOpen); }
  notesToggle.addEventListener('click', toggleNotes);
  document.getElementById('closeNotes').addEventListener('click', toggleNotes);

  setTimeout(hideHint, 5000);

  // ask a question / leave a comment
  (function(){
    const askBtn = document.getElementById('askBtn');
    const backdrop = document.getElementById('askBackdrop');
    const context = document.getElementById('askContext');
    const textEl = document.getElementById('askText');
    const nameEl = document.getElementById('askName');
    const sendBtn = document.getElementById('askSend');
    const cancelBtn = document.getElementById('askCancel');
    const statusEl = document.getElementById('askStatus');
    const DECK = 'SPM381 Week 11 — Sport Consumer Emotions &amp; Attributions';

    function open(){
      const slide = SLIDES[current] || {};
      const title = slide.title || slide.text || slide.label || '(untitled)';
      context.textContent = 'Slide ' + (current+1) + ' of ' + SLIDES.length + ' — ' + title;
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      sendBtn.disabled = false; sendBtn.textContent = 'Send';
      backdrop.classList.add('open');
      setTimeout(()=> textEl.focus(), 50);
    }
    function close(){
      backdrop.classList.remove('open');
      textEl.value=''; nameEl.value='';
    }
    async function send(){
      const question = textEl.value.trim();
      const name = nameEl.value.trim();
      if(!name){
        statusEl.textContent = 'Please enter your name.';
        statusEl.className = 'ask-status err';
        nameEl.focus();
        return;
      }
      if(!question){
        statusEl.textContent = 'Please enter a question or comment.';
        statusEl.className = 'ask-status err';
        textEl.focus();
        return;
      }
      if(!window.QUESTIONS_API){
        statusEl.textContent = "This form isn't connected yet — let your professor know.";
        statusEl.className = 'ask-status err';
        return;
      }
      sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      const slide = SLIDES[current] || {};
      try{
        await fetch(window.QUESTIONS_API, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({
            deck: DECK,
            slideIndex: current+1,
            slideTitle: slide.title || slide.text || slide.label || '',
            question: question,
            name: name
          })
        });
        statusEl.textContent = 'Sent — thanks!';
        statusEl.className = 'ask-status ok';
        setTimeout(close, 1100);
      }catch(err){
        statusEl.textContent = "Couldn't send — check your connection and try again.";
        statusEl.className = 'ask-status err';
        sendBtn.disabled = false; sendBtn.textContent = 'Send';
      }
    }
    askBtn.addEventListener('click', open);
    cancelBtn.addEventListener('click', close);
    sendBtn.addEventListener('click', send);
    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) close(); });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && backdrop.classList.contains('open')) close();
    });
  })();

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  activate(startIdx);
})();
</script>
<script id="w10-components-core">/* Base enhancer (from Week 10, trimmed to what Week 11 uses): is-type-* / look-* classes,
 * .sb-title on slide 1, sb-prompt / sb-big on statements, and the decorative .sb-rule tick after each h1. Never changes text. */
(function(){
  'use strict';
  var dataEl = document.getElementById('slide-data'); if(!dataEl) return;
  var SLIDES; try{ SLIDES = JSON.parse(dataEl.textContent); }catch(e){ return; }
  function reveal(node, delay){ node.classList.add('reveal-item'); node.style.transitionDelay = (delay||0)+'ms'; return node; }
  function deco(tag, cls){ var d = document.createElement(tag); d.className = cls; d.setAttribute('aria-hidden','true'); d.setAttribute('data-deco',''); return d; }
  function enhance(sec){
    if(sec.dataset.cmp) return;
    var idx = +sec.dataset.index, s = SLIDES[idx] || {};
    var inner = sec.querySelector('.slide-inner'); if(!inner) return;
    sec.dataset.cmp = '1';
    sec.classList.add('is-type-'+s.type);
    if(idx === 0) sec.classList.add('sb-title');
    var h = inner.querySelector(':scope > h1.title-slide');
    if(h){ var r = deco('span','sb-rule'); reveal(r, 0); h.after(r); }
    if(s.look){
      inner.classList.add('look-'+s.look); sec.classList.add('is-'+s.look);
      if(s.look === 'section'){
        inner.removeAttribute('style');
        var t = (s.title||'').trim();
        if(/\?\s*$/.test(t)) inner.classList.add('sb-prompt');
        else if(t.split(/\s+/).length <= 2) inner.classList.add('sb-big');
      }
    }
    if(sec.classList.contains('active')) requestAnimationFrame(function(){ sec.querySelectorAll('.reveal-item').forEach(function(r){ r.classList.add('in'); }); });
  }
  function run(){ document.querySelectorAll('#deck > section.slide').forEach(enhance); }
  run();
  window.DeckComponents = { run: run, revealAll: function(){} };
})();
</script>
<script id="w11-components">/* ==== components.js — SPM381 Week 11 "AFFECT FIELD" ====
 * Post-render enhancer. Runs AFTER the engine's build() and the week's base enhancer.
 * Reads the optional `variant` field (plus a few option fields) on each slide in #slide-data
 * and re-composes that slide's existing DOM. Text is never retyped: nodes are MOVED into new
 * wrappers, and text nodes are only split (Text.splitText) so a phrase can be wrapped for tinting.
 * Everything this file creates that is not a wrapper is decorative and aria-hidden.
 *
 * Variants handled (slide index is 0-based):
 *   cards     bullets -> responsive card grid with numbered badges          (s3)
 *   lead      first bullet as a large lead over a valence rail; rest below  (s4)
 *   statement single bullet as one big sentence inside the blend field     (s5)
 *   steps     optional lead label + numbered sequential steps on a rail     (s20)
 *   pull      first bullet as lede, last bullet as a pull quote             (s21)
 *   tiles     subhead as a statement, bullets as big numbered tiles        (s23)
 *   callout   bullets inside a callout card with a coloured stripe          (s25)
 *   chips     .w11-q question spans -> 2x2 emotion-chip grid                (s30)
 *   bars      datatable rows get value bars, warm/cool row tints            (s15)
 * Option fields: tint:[[phrase,tone],...]  cite:true  hues:[...]  rowTones:[...]
 *                stripe:"ctl"|"loc"|"stab"  lead:true (steps)
 * Unknown variants (e.g. the legacy "rows") are ignored.
 */
(function(){
  'use strict';
  var dataEl = document.getElementById('slide-data');
  if(!dataEl) return;
  var SLIDES; try{ SLIDES = JSON.parse(dataEl.textContent); }catch(e){ return; }
  /* optional runtime override map (same shape as slide-layouts.json) */
  var EXTRA = window.W11_SLIDE_LAYOUTS || null;
  if(EXTRA) Object.keys(EXTRA).forEach(function(k){
    if(/^\d+$/.test(k) && SLIDES[+k]) Object.keys(EXTRA[k]).forEach(function(f){ SLIDES[+k][f] = EXTRA[k][f]; });
  });

  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced(){ return (mq && mq.matches) || root.classList.contains('reduced'); }
  var STEP = 70, CAP = 8;
  function delayFor(i, base){ return reduced() ? 0 : (base||0) + Math.min(i, CAP-1)*STEP; }

  function wrap(tag, cls){ var e = document.createElement(tag); if(cls) e.className = cls; return e; }
  function deco(tag, cls){ var e = wrap(tag, cls); e.setAttribute('aria-hidden','true'); e.setAttribute('data-deco',''); return e; }
  function reveal(node, d){ node.classList.add('reveal-item'); node.style.transitionDelay = d+'ms'; return node; }
  function moveChildren(from, to){ while(from.firstChild) to.appendChild(from.firstChild); return to; }
  function pad2(n){ return (n<10?'0':'')+n; }
  /* decorative index numerals are drawn from a data attribute via CSS, so no text node is added */
  function numBadge(cls, n){ var b = deco('span', cls); b.setAttribute('data-n', pad2(n)); return b; }

  /* ---- text-node helpers (split, never retype) ---- */
  function textNodes(rootEl){
    var out = [], w = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null);
    while(w.nextNode()) out.push(w.currentNode);
    return out;
  }
  function wrapRange(node, start, len, cls){
    var mid = node.splitText(start);
    mid.splitText(len);
    var sp = wrap('span', cls);
    mid.parentNode.insertBefore(sp, mid);
    sp.appendChild(mid);
    return sp;
  }
  /* wrap every occurrence of `phrase` (case-sensitive, exact) inside rootEl */
  function tintPhrase(rootEl, phrase, cls){
    if(!phrase) return;
    textNodes(rootEl).forEach(function(tn){
      if(tn.parentNode && tn.parentNode.closest && tn.parentNode.closest('.cx-t')) return;
      var cur = tn;
      while(cur){
        var i = cur.nodeValue.indexOf(phrase);
        if(i < 0) break;
        var sp = wrapRange(cur, i, phrase.length, cls);
        cur = (sp.nextSibling && sp.nextSibling.nodeType === 3) ? sp.nextSibling : null;
      }
    });
  }
  function applyTints(rootEl, s){
    (s.tint||[]).forEach(function(t){ tintPhrase(rootEl, t[0], 'cx-t cx-t-'+(t[1]||'blend')); });
  }
  /* parenthetical citations "(Name, 1995; ...)" -> mono cite spans */
  var CITE_RE = /\((?:[^()]*?(?:19|20)\d\d[a-z]?)(?:[^()]*)\)/g;
  function markCites(rootEl){
    textNodes(rootEl).forEach(function(tn){
      var t = tn.nodeValue, m, hits = [];
      CITE_RE.lastIndex = 0;
      while((m = CITE_RE.exec(t))) hits.push([m.index, m[0].length]);
      for(var k = hits.length-1; k >= 0; k--) wrapRange(tn, hits[k][0], hits[k][1], 'cx-cite');
    });
  }

  /* ---- variant handlers ---- */
  var V = {};

  /* cards: ul.bullets -> card grid, each card = badge + moved li content */
  V.cards = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    if(s.cite) markCites(ul);
    applyTints(ul, s);
    ul.classList.add('cx-cards');
    ul.setAttribute('data-count', ul.children.length);
    Array.prototype.forEach.call(ul.children, function(li, i){
      li.classList.add('cx-card');
      var body = moveChildren(li, wrap('span','cx-card-body'));
      li.appendChild(numBadge('cx-num', i+1));
      li.appendChild(deco('span','cx-card-bar'));
      li.appendChild(body);
      reveal(li, delayFor(i, 160));
    });
  };

  /* lead: valence rail + first bullet huge, the rest as supporting rows */
  V.lead = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    if(s.cite) markCites(ul);
    applyTints(ul, s);
    ul.classList.add('cx-lead');
    var lis = ul.children;
    if(lis[0]){
      lis[0].classList.add('cx-lead-main');
      var rail = deco('span','cx-rail');
      rail.appendChild(deco('i','cx-rail-dot'));
      lis[0].insertBefore(rail, lis[0].firstChild);
    }
    Array.prototype.forEach.call(lis, function(li, i){
      if(i > 0){ li.classList.add('cx-lead-sub'); li.insertBefore(deco('span','cx-because'), li.firstChild); }
      reveal(li, delayFor(i, 140));
    });
  };

  /* statement: one big sentence floating in the warm/cool blend field */
  V.statement = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    applyTints(ul, s);
    ul.classList.add('cx-statement');
    var field = deco('div','cx-field');
    field.appendChild(deco('i','cx-orb cx-orb-joy'));
    field.appendChild(deco('i','cx-orb cx-orb-sad'));
    sec.insertBefore(field, sec.firstChild);
    Array.prototype.forEach.call(ul.children, function(li, i){ reveal(li, delayFor(i, 200)); });
  };

  /* steps: optional lead label, then numbered sequential points on a rail */
  V.steps = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    applyTints(ul, s);
    ul.classList.add('cx-steps');
    var n = 0;
    Array.prototype.forEach.call(ul.children, function(li, i){
      if(i === 0 && s.lead){ li.classList.add('cx-step-lead'); reveal(li, delayFor(0, 120)); return; }
      n++;
      li.classList.add('cx-step', 'cx-step-'+n);
      var body = moveChildren(li, wrap('span','cx-step-body'));
      li.appendChild(numBadge('cx-node', n));
      li.appendChild(body);
      reveal(li, delayFor(i, 160));
    });
    ul.style.setProperty('--steps', n);
  };

  /* pull: lede + pull quote (last bullet) */
  V.pull = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    if(s.cite) markCites(ul);
    applyTints(ul, s);
    ul.classList.add('cx-pull');
    var lis = ul.children, last = lis.length-1;
    Array.prototype.forEach.call(lis, function(li, i){
      if(i === last && last > 0){
        li.classList.add('cx-pull-quote');
        li.insertBefore(deco('span','cx-qmark'), li.firstChild);
      } else li.classList.add('cx-pull-lede');
      reveal(li, delayFor(i, 160));
    });
  };

  /* tiles: subhead as statement, bullets as big numbered tiles */
  V.tiles = function(sec, inner, s){
    var sh = inner.querySelector(':scope > .subhead');
    if(sh){ sh.classList.add('cx-tiles-q'); applyTints(sh, s); }
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    ul.classList.add('cx-tiles');
    var tones = ['loc','ctl','stab'];
    Array.prototype.forEach.call(ul.children, function(li, i){
      li.classList.add('cx-tile', 'cx-tone-'+tones[i % 3]);
      var body = moveChildren(li, wrap('span','cx-tile-body'));
      li.appendChild(deco('span','cx-tile-stripe'));
      li.appendChild(numBadge('cx-num', i+1));
      li.appendChild(body);
      reveal(li, delayFor(i, 220));
    });
  };

  /* callout: bullets in a card with a coloured stripe */
  V.callout = function(sec, inner, s){
    var ul = inner.querySelector('ul.bullets'); if(!ul) return;
    applyTints(ul, s);
    var card = wrap('div','cx-callout cx-stripe-'+(s.stripe||'ctl'));
    card.appendChild(deco('span','cx-callout-stripe'));
    ul.parentNode.insertBefore(card, ul);
    card.appendChild(ul);
    ul.classList.add('cx-callout-list');
    reveal(card, delayFor(0, 120));
    Array.prototype.forEach.call(ul.children, function(li, i){
      var body = moveChildren(li, wrap('span','cx-callout-body'));
      li.appendChild(numBadge('cx-num', i+1));
      li.appendChild(body);
      reveal(li, delayFor(i+1, 160));
    });
  };

  /* chips: .w11-q spans -> 2x2 grid of emotion chips */
  V.chips = function(sec, inner, s){
    var qs = inner.querySelectorAll('.w11-q'); if(!qs.length) return;
    var grid = qs[0].parentNode;
    grid.classList.add('cx-chips');
    var hues = s.hues || ['pride','gratitude','shame','anger'];
    Array.prototype.forEach.call(qs, function(q, i){
      var hue = hues[i % hues.length];
      q.classList.add('cx-chip', 'cx-hue-'+hue);
      var body = moveChildren(q, wrap('span','cx-chip-body'));
      /* underline the emotion word (last word before "?") by splitting its text node */
      var tns = textNodes(body), tn = tns[tns.length-1];
      if(tn){ var m = tn.nodeValue.match(/(\S+)\?\s*$/); if(m) wrapRange(tn, m.index, m[1].length, 'cx-chip-word'); }
      q.appendChild(deco('span','cx-chip-bar'));
      q.appendChild(numBadge('cx-num', i+1));
      q.appendChild(body);
      reveal(q, delayFor(i, 160));
    });
  };

  /* bars: datatable value bars, warm (win) / cool (loss) rows */
  V.bars = function(sec, inner, s){
    var table = inner.querySelector('table.data-table'); if(!table) return;
    table.classList.add('cx-bars');
    var wrapEl = table.closest('.data-table-wrap'); if(wrapEl) wrapEl.classList.add('cx-bars-wrap');
    var tones = s.rowTones || [];
    var max = +s.barMax || 1;
    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function(tr, i){
      var label = tr.querySelector('td.dt-cluster'), cell = tr.querySelector('td.dt-behaviors');
      if(!cell) return;
      var tone = tones[i] || (label && /loss/i.test(label.textContent) ? 'sad' : 'joy');
      tr.classList.add('cx-row', 'cx-row-'+tone);
      var val = parseFloat(cell.textContent.replace(/[^\d.\-]/g,''));
      var pct = isNaN(val) ? 0 : Math.max(0, Math.min(1, val/max));
      cell.classList.add('cx-valcell');
      var num = cell.querySelector('div'); if(num) num.classList.add('cx-val');
      var track = deco('span','cx-track');
      var fill = deco('i','cx-fill');
      fill.style.setProperty('--v', pct.toFixed(4));
      fill.style.transitionDelay = delayFor(i, 360)+'ms';
      track.appendChild(fill);
      cell.insertBefore(track, cell.firstChild);
      tr.style.transitionDelay = delayFor(i, 200)+'ms';
    });
    var lg = inner.querySelector('.table-legend');
    if(lg){ lg.classList.add('cx-conclusion'); applyTints(lg, s); }
  };

  function enhance(sec){
    if(sec.dataset.cx) return;
    var idx = +sec.dataset.index, s = SLIDES[idx] || {};
    var fn = s.variant && V[s.variant]; if(!fn) return;
    var inner = sec.querySelector('.slide-inner'); if(!inner) return;
    sec.dataset.cx = s.variant;
    sec.classList.add('cx', 'cx-v-'+s.variant, s.part === 2 || idx >= 18 ? 'cx-part2' : 'cx-part1');
    try{ fn(sec, inner, s); }catch(err){ if(window.console) console.warn('components.js', idx, err); }
    if(sec.classList.contains('active')) requestAnimationFrame(function(){
      sec.querySelectorAll('.reveal-item').forEach(function(r){ r.classList.add('in'); });
    });
  }
  function run(){ document.querySelectorAll('#deck > section.slide').forEach(enhance); }
  run();
  window.W11Components = { run: run, variants: Object.keys(V) };
})();
</script>
<script id="w11-motion-js">/* ==== motion.js — SPM381 Week 11 "Affect Field" ====
   Hooks slide changes with a MutationObserver on .slide.active. Adds classes,
   CSS vars and aria-hidden decorative elements only; never changes text content
   (titles are split into word spans whose combined textContent is identical). */
(function(){
  'use strict';
  function init(){
    var deck = document.getElementById('deck'); if(!deck || deck.dataset.m11) return;
    deck.dataset.m11 = '1';
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    function reduced(){ return (mq && mq.matches) || root.classList.contains('reduced'); }
    var slides = Array.prototype.slice.call(deck.querySelectorAll(':scope > section.slide'));
    if(!slides.length) return;
    var data = [];
    try{ data = JSON.parse(document.getElementById('slide-data').textContent); }catch(e){}

    function deco(tag, cls, n){
      var d = document.createElement(tag); d.className = cls;
      d.setAttribute('aria-hidden','true'); d.setAttribute('data-deco','');
      for(var i=0;i<(n||0);i++) d.appendChild(document.createElement('i'));
      return d;
    }
    function titleOf(i){ return ((data[i]||{}).title||'').trim(); }

    /* ---------- Part flag: Part II starts at the first non-question section statement ---------- */
    var part2 = -1;
    slides.forEach(function(s, i){
      var d = data[i]||{};
      if(part2 < 0 && i > 0 && d.look === 'section' && !/\?\s*$/.test(titleOf(i))) part2 = i;
    });
    if(part2 < 0) part2 = Math.min(18, slides.length-1);

    /* ---------- body-level layers ---------- */
    var band = deco('div','m11-band',3); document.body.appendChild(band);
    var orbs = deco('div','m11-orbs',2);
    var bga = document.querySelector('.bga, .bg-wash');
    if(bga && bga.parentNode === document.body) bga.after(orbs); else document.body.insertBefore(orbs, document.body.firstChild);

    /* ---------- word split (text preserved exactly) ---------- */
    var MIXWORDS = /^(Emotions|Questions\?)$/;
    function splitWords(h, mix){
      if(h.classList.contains('m11-split')) return;
      var before = h.textContent, wi = 0;
      Array.prototype.slice.call(h.childNodes).forEach(function(node){
        if(node.nodeType !== 3) return;
        var frag = document.createDocumentFragment();
        node.textContent.split(/(\s+)/).forEach(function(tok){
          if(!tok) return;
          if(/^\s+$/.test(tok)){ frag.appendChild(document.createTextNode(tok)); return; }
          var w = document.createElement('span'); w.className = 'm11-w'; w.textContent = tok;
          w.style.setProperty('--wi', wi++);
          if(mix && MIXWORDS.test(tok)) w.classList.add('m11-mixword');
          frag.appendChild(w);
        });
        node.parentNode.replaceChild(frag, node);
      });
      if(h.textContent !== before){ h.textContent = before; return; } /* safety: never alter text */
      h.classList.add('m11-split');
    }

    /* ---------- per-slide enhancement (classes + decorative layers) ---------- */
    slides.forEach(function(s, i){
      var d = data[i]||{}, inner = s.querySelector('.slide-inner'); if(!inner) return;
      var p2 = i >= part2;
      s.classList.add(p2 ? 'm11-p2' : 'm11-p1');
      s.dataset.m11Part = p2 ? '2' : '1';
      var kind = 'body';
      if(d.type === 'title') kind = 'title';
      else if(d.type === 'closing') kind = 'closing';
      else if(d.type === 'datatable') kind = 'datatable';
      else if(d.look === 'section') kind = (i === part2) ? 'section' : 'question';
      else if(inner.querySelector('.w11-q')) kind = 'agenda';
      else if(inner.querySelector('.equation svg')) kind = 'diagram';
      else if(inner.querySelector('.sp1-ig, .w11-flow')) kind = 'flow';
      else if(d.type === 'media' && !d.title && !d.html && !(d.bullets||[]).length && (d.images||[]).length) kind = 'image';
      s.classList.add('m11-k-'+kind);

      inner.querySelectorAll('h1.title-slide, h1.title-hero').forEach(function(h){ splitWords(h, kind==='title' || kind==='closing'); });

      /* bottom rails (s1, s31) and the s19 stripes / s20-31 edge are drawn by the theme layer */
      if(kind === 'section') s.classList.add('section-attr');

      /* flow / hub boxes and agenda chips pop with the spring ease */
      var pi = 0;
      inner.querySelectorAll('.w11-box').forEach(function(b){
        b.classList.add('m11-pop'); b.style.setProperty('--pi', Math.min(pi++, 6));
      });
      pi = 0;
      inner.querySelectorAll('.w11-arrow').forEach(function(a){
        a.classList.add('m11-arrowpop'); a.style.setProperty('--pi', Math.min(pi++ * 1 + 1, 6));
      });

    });

    /* ---------- activation choreography ---------- */
    var last = -1, doneTimer = 0, bandTimer = 0;
    function stagger(s){
      var R = reduced(), n = 0;
      s.querySelectorAll('.reveal-item').forEach(function(r){
        if(r.matches('tr')) return;
        var t = R ? 0 : 180 + Math.min(n, 7) * 70; n++;
        r.style.transitionDelay = t+'ms';
        if(r.matches('h1')) r.style.setProperty('--m11-t0', (R ? 0 : t + 40)+'ms');
      });
      s.querySelectorAll('tbody tr.reveal-item').forEach(function(tr, i){
        tr.style.transitionDelay = (R ? 0 : 260 + Math.min(i, 7) * 70)+'ms';
      });
      s.querySelectorAll('.photo').forEach(function(p, i){
        p.style.setProperty('--pd', (R ? 0 : 300 + Math.min(i, 5) * 90)+'ms');
      });
    }
    function sweep(part, back){
      if(reduced()) return;
      band.setAttribute('data-part', part);
      band.classList.remove('go','back');
      void band.offsetWidth;
      if(back) band.classList.add('back');
      band.classList.add('go');
      clearTimeout(bandTimer);
      bandTimer = setTimeout(function(){ band.classList.remove('go','back'); }, 1150);
    }
    function onActive(){
      var a = deck.querySelector(':scope > .slide.active'); if(!a) return;
      var idx = slides.indexOf(a); if(idx === last) return;
      var back = last > idx;
      slides.forEach(function(s){ if(s !== a) s.classList.remove('m11-done'); });
      a.classList.remove('m11-done');
      stagger(a);
      sweep(a.dataset.m11Part || '1', back);
      document.body.classList.toggle('m11-orbs-on', !reduced() && a.classList.contains('m11-p1') && (a.classList.contains('m11-k-title') || a.classList.contains('m11-k-question')));
      clearTimeout(doneTimer);
      doneTimer = setTimeout(function(){ a.classList.add('m11-done'); }, reduced() ? 0 : 1300);
      last = idx;
    }
    new MutationObserver(onActive).observe(deck, {subtree:true, attributes:true, attributeFilter:['class']});
    root.classList.add('m11-on');
    onActive();
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
<script id="w11-svg-inline">/* Week 11 diagram animation. Tags existing inline SVG/HTML diagrams, adds .play on the active slide. */
(function(){
  'use strict';
  /* CSS lives in <style id="design-layers"> (svg/w11-motion.css) */
  var SLIDES = {13:'svg',18:'svg',28:'svg'};
  function tag(el, kind, i){ if(!el) return; el.classList.add('w11a','w11a-'+kind); el.style.setProperty('--i', Math.min(i,12)); }
  function svgSeq(svg){
    var n=0, last=-1;
    Array.prototype.forEach.call(svg.children, function(el){
      var t = el.tagName.toLowerCase();
      if(t==='rect'||t==='ellipse'){ last = n; tag(el,'pop',n++); }
      else if(t==='line'){ el.setAttribute('pathLength','1'); tag(el,'line',n++); }
      else if(t==='polygon'){ tag(el,'wipe',n++); }
      else if(t==='text'){
        var prev = el.previousElementSibling, pt = prev && prev.tagName.toLowerCase();
        var pi = prev && prev.classList.contains('w11a') ? +prev.style.getPropertyValue('--i') : n;
        if(pt==='rect'||pt==='ellipse'||pt==='text'){ tag(el,'fade',pi+1); } else { tag(el,'fade',n++); }
      }
    });
  }
  function htmlSeq(sec){
    var n=0;
    function leaf(el){
      if(!el.firstElementChild && !el.textContent.trim()){ if(el.style.borderTop){ tag(el,'bar',n++); } return; }
      if(el.classList.contains('w11-arrow') || el.textContent.trim()==='→'){ tag(el,'fade',n++); return; }
      tag(el,'rise',n++);
    }
    sec.querySelectorAll('.sp1-ig').forEach(function(ig){
      Array.prototype.forEach.call(ig.children, function(c){
        var arrow = Array.prototype.some.call(c.children, function(x){ return x.textContent.trim()==='→' || x.style.borderTop; });
        if(arrow) Array.prototype.forEach.call(c.children, leaf); else leaf(c);
      });
    });
    sec.querySelectorAll('.w11-flow > *, .w11-q, .w11-p, .w11-note').forEach(leaf);
  }
  function init(){
    var secs = document.querySelectorAll('#deck > section.slide');
    secs.forEach(function(sec, k){
      var kind = SLIDES[k+1]; if(!kind || sec.dataset.w11) return;
      sec.dataset.w11 = '1';
      var svg = sec.querySelector('svg[role="img"], svg.w11svg');
      if(svg && (kind==='svg')) svgSeq(svg); else htmlSeq(sec);
    });
    sync();
  }
  function sync(){
    document.querySelectorAll('#deck > section.slide').forEach(function(sec){
      var on = sec.classList.contains('active');
      if(on && !sec.classList.contains('play')) requestAnimationFrame(function(){ sec.classList.add('play'); });
      if(!on && sec.classList.contains('play')) sec.classList.remove('play');
    });
  }
  var deck = document.getElementById('deck');
  if(deck){ new MutationObserver(sync).observe(deck,{subtree:true,attributes:true,attributeFilter:['class']}); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
  window.addEventListener('load', init);
})();
</script>

<script>
(function(){
  var bd=document.getElementById('lightboxBackdrop'), lim=document.getElementById('lightboxImg');
  function open(src,alt){ lim.src=src; lim.alt=alt||''; bd.classList.add('open'); }
  function close(){ bd.classList.remove('open'); }
  function srcOf(photo){ var im=photo.querySelector('img'); return im ? im.getAttribute('src') : null; }
  function addButtons(){
    document.querySelectorAll('#deck .photo').forEach(function(p){
      if(p.querySelector('.photo-zoom') || !srcOf(p)) return;
      var b=document.createElement('button'); b.className='photo-zoom'; b.type='button';
      b.setAttribute('aria-label','Enlarge image'); b.title='Enlarge image'; b.textContent='+';
      p.appendChild(b);
    });
  }
  document.addEventListener('click', function(e){
    var p=e.target.closest && e.target.closest('#deck .photo');
    if(p && (e.target.closest('.photo-zoom') || e.target.tagName==='IMG' || e.target.closest('svg'))){
      var s=srcOf(p); if(!s) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      open(s, (p.querySelector('img')||{}).alt);
    }
  }, true);
  bd.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  document.addEventListener('keydown', function(e){
    if(!bd.classList.contains('open')) return;
    e.stopPropagation(); e.stopImmediatePropagation();
    if(e.key==='Escape') close();
  }, true);
  addButtons(); setTimeout(addButtons, 800); setTimeout(addButtons, 2500);
})();
</script>
